spring:
  application:
    name: payment-service
  config:
    import: "optional:file:../.env[.properties],optional:file:.env[.properties]"
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8082}

# Firebase Configuration - ALL FROM ENVIRONMENT VARIABLES
firebase:
  project-id: ${FIREBASE_PROJECT_ID}
  credentials-path: ${FIREBASE_CREDENTIALS_PATH:/secrets/firebase-sa.json}

# Business Logic Defaults
business:
  cutoff-date: ${CUTOFF_DATE:2025-04-29}
  payment-cutoff-date: ${PAYMENT_CUTOFF_DATE:2025-04-29}
  batch-size: ${BATCH_SIZE:100}
  max-date-range-months: ${MAX_DATE_RANGE_MONTHS:12}

# Banking API Configuration
# TBC connectivity is TBC DBI (SOAP + mutual TLS + WS-Security), not OAuth —
# see TBC_INTEGRATION_ANALYSIS.md at the repo root.
bank-api:
  tbc:
    enabled: ${TBC_DBI_ENABLED:false}
    endpoint: ${TBC_DBI_ENDPOINT:https://secdbi.tbconline.ge/dbi/dbiService}
    username: ${TBC_DBI_USERNAME:}
    password: ${TBC_DBI_PASSWORD:}
    certificate-path: ${TBC_DBI_CERTIFICATE_PATH:}
    certificate-base64: ${TBC_DBI_CERTIFICATE_BASE64:}
    certificate-password: ${TBC_DBI_CERTIFICATE_PASSWORD:}
    account-number: ${TBC_DBI_ACCOUNT_NUMBER:}
    currency: ${TBC_DBI_CURRENCY:GEL}
    page-size: ${TBC_DBI_PAGE_SIZE:700}
    timeout-seconds: ${TBC_DBI_TIMEOUT_SECONDS:120}
  sync-interval-minutes: ${BANK_SYNC_INTERVAL:60}
  sync-overlap-days: ${BANK_SYNC_OVERLAP_DAYS:3}
  min-sync-interval-seconds: ${BANK_SYNC_MIN_INTERVAL_SECONDS:120}
  sync-start-date: ${BANK_SYNC_START_DATE:}

# Actuator endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when-authorized

# OpenAPI/Swagger
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

# Logging
logging:
  level:
    ge.tastyerp: ${LOG_LEVEL:INFO}
    com.google.cloud: WARN
    org.apache.poi: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} [%X{requestId}] - %msg%n"
